name: check-laws

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 28-31 * *"

permissions:
  contents: write

jobs:
  check-official-laws:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 매월 1일 법령 점검
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
        run: node scripts/check-laws.mjs

      - name: 변경 사항 저장
        run: |
          if git diff --quiet; then
            echo "변경 사항이 없습니다."
            exit 0
          fi
          git config user.name "polnote-law-bot"
          git config user.email "polnote-law-bot@users.noreply.github.com"
          git add law-check-status.json law-data.json
          git commit -m "chore: 법령 자료 월간 점검 갱신"
          git push
