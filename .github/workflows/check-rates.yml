name: 수당 단가 공식자료 점검

on:
  schedule:
    - cron: "0 0 * * *" # 한국시간 매일 오전 9시
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-official-rates:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 공식 봉급표 존재 확인
        id: source
        run: |
          YEAR=$(date -u -d '+9 hours' +%Y)
          URL="https://www.mpm.go.kr/mpm/info/resultPay/bizSalary/${YEAR}/"
          STATUS=$(curl -L -s -o official-rate-page.html -w "%{http_code}" "$URL")
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: 점검 결과 저장
        run: |
          node <<'NODE'
          const fs = require('fs');
          const year = process.env.YEAR;
          const status = process.env.STATUS;
          const url = process.env.URL;

          const result = {
            checkedAt: new Date().toISOString(),
            year: Number(year),
            sourceUrl: url,
            sourceStatus: status,
            result: status === '200'
              ? 'official_source_found_review_required'
              : 'official_source_not_published'
          };

          fs.writeFileSync(
            'rate-check-status.json',
            JSON.stringify(result, null, 2) + '\n'
          );
          NODE
        env:
          YEAR: ${{ steps.source.outputs.year }}
          STATUS: ${{ steps.source.outputs.status }}
          URL: ${{ steps.source.outputs.url }}

      - name: 점검 결과 반영
        run: |
          git config user.name "polnote-rate-bot"
          git config user.email "polnote-rate-bot@users.noreply.github.com"
          git add rate-check-status.json
          git diff --cached --quiet || git commit -m "chore: 공식 수당 자료 점검"
          git push

      - name: 공식 자료 공개 시 알림 이슈 생성
        if: steps.source.outputs.status == '200'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `${{ steps.source.outputs.year }}년 공식 봉급표 확인 필요`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: '인사혁신처 공식 봉급표 페이지가 확인되었습니다. 단가표 구조를 검증한 뒤 rates.json에 반영하십시오.'
              });
            }
